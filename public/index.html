
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MCoinTap PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
background:#020617;
font-family:Arial;
color:white;
padding:20px;
text-align:center;
}
.card{
background:#111827;
padding:20px;
border-radius:20px;
max-width:420px;
margin:auto;
box-shadow:0 0 20px #22c55e55;
}
button{
padding:14px 25px;
margin:8px;
border:none;
border-radius:12px;
background:#22c55e;
color:white;
font-weight:bold;
cursor:pointer;
}
h1{
color:#22c55e;
}
.box{
background:#1e293b;
padding:12px;
border-radius:12px;
margin-top:10px;
}
</style>
</head>

<body>

<div class="card">

<h1>MCoinTap PRO</h1>

<div class="box">
<h2 id="balance">Balance: 0</h2>
<p id="vip">VIP 1</p>
</div>

<button onclick="watchAd()">WATCH AD (+10)</button>
<button onclick="dailyBonus()">DAILY BONUS</button>
<button onclick="spin()">SPIN WHEEL</button>

<div class="box">
<h3>Referral</h3>
<p id="ref">Loading...</p>
</div>

<div class="box">
<h3>Leaderboard</h3>
<div id="leaderboard"></div>
</div>

<p id="status"></p>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

async function loadUser(){

const res = await fetch("/api/user",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
initData:tg.initData
})
});

const data = await res.json();

document.getElementById("balance").innerText =
"Balance: " + data.balance;

document.getElementById("vip").innerText =
"VIP " + data.vip_level;

document.getElementById("ref").innerText =
data.referral_code;

}

async function watchAd(){

document.getElementById("status").innerText =
"Watching ad...";

setTimeout(async()=>{

const res = await fetch("/api/claim",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
initData:tg.initData
})
});

const data = await res.json();

document.getElementById("status").innerText =
data.message || data.error;

loadUser();

},5000);

}

async function dailyBonus(){

const res = await fetch("/api/daily",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
initData:tg.initData
})
});

const data = await res.json();

document.getElementById("status").innerText =
data.message || data.error;

loadUser();

}

async function spin(){

const res = await fetch("/api/spin",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
initData:tg.initData
})
});

const data = await res.json();

document.getElementById("status").innerText =
data.message || data.error;

loadUser();

}

loadUser();

</script>

</body>
</html>
