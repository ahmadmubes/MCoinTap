<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MCoinTap</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:100%;
      max-width:420px;
      background:#1e293b;
      padding:20px;
      border-radius:15px;
    }
    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-weight:bold;
      margin-top:10px;
    }
    .box{
      margin-top:15px;
      padding:10px;
      background:#0f172a;
      border-radius:10px;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>💰 MCoinTap</h2>

  <div id="user">Loading...</div>

  <div class="box">
    💰 Balance: <span id="balance">0</span>
  </div>

  <button onclick="claim()">CLAIM</button>

  <div class="box">
    👥 Referral: <span id="ref">0</span>
  </div>

  <div class="box">
    🏆 Leaderboard
    <div id="leaderboard">Loading...</div>
  </div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

document.getElementById("user").innerText =
  user.first_name + " (" + (user.username || "no username") + ")";

async function claim(){

  const res = await fetch("/api/claim", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      initData: tg.initData
    })
  });

  const data = await res.json();

  if(data.balance){
    document.getElementById("balance").innerText = data.balance;
  } else {
    alert(data.error);
  }
}

async function loadLeaderboard(){

  const res = await fetch("/api/leaderboard");
  const data = await res.json();

  document.getElementById("leaderboard").innerHTML =
    data.data.map((u,i)=>`
      <div>
        #${i+1} ${u.username || u.telegram_id}
        - ${u.balance} 💰
        - Ref: ${u.referral_count || 0}
      </div>
    `).join("");
}

loadLeaderboard();

</script>

</body>
</html>
