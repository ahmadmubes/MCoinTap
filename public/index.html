<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCoinTap PRO</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b,#020617);
  color:white;
  display:flex;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  text-align:center;
}

h2{
  margin-bottom:10px;
}

.box{
  background:rgba(255,255,255,0.05);
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:600;
  cursor:pointer;
}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-top:8px;
  text-align:center;
}

.small{
  font-size:12px;
  opacity:0.7;
}

/* leaderboard tetap kiri */
.leaderboard{
  text-align:left;
  background:rgba(255,255,255,0.05);
  padding:10px;
  border-radius:12px;
}
</style>

</head>

<body>

<div class="card">

<h2>💰 MCoinTap PRO</h2>

<div class="box">👤 <span id="user"></span></div>

<div class="box">💰 Balance: <span id="balance">0</span></div>

<div class="box">🏆 Level: <span id="level">1</span></div>

<div class="box">⚡ EXP: <span id="exp">0</span></div>

<div class="box">⏳ Cooldown: <span id="cooldown">-</span></div>

<div class="box">🎯 Sisa Claim: <span id="remain">-</span></div>

<button onclick="claim()">CLAIM</button>

<div class="box">
👥 Referral: <span id="ref">0</span>
</div>

<div class="box">
💸 Withdraw DANA
<input id="dana" placeholder="Nomor DANA">
<button onclick="withdraw()">WITHDRAW</button>
<div class="small">Min 5000 coin</div>
</div>

<div class="leaderboard">
🏆 Leaderboard
<div id="leaderboard">Loading...</div>
</div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

document.getElementById("user").innerText =
user.first_name + " @" + (user.username || "-");

async function claim(){

const res = await fetch("/api/claim",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({ initData: tg.initData })
});

const data = await res.json();

if(data.balance){

document.getElementById("balance").innerText = data.balance;
document.getElementById("remain").innerText = data.remaining_today;
document.getElementById("cooldown").innerText = data.cooldown;

// LEVEL SYSTEM
if(data.level){
  document.getElementById("level").innerText = data.level;
}

if(data.exp){
  document.getElementById("exp").innerText = data.exp;
}

// countdown UI
let t = data.cooldown;
let i = setInterval(()=>{
  t--;
  document.getElementById("cooldown").innerText = t;
  if(t <= 0) clearInterval(i);
},1000);

}else{
alert(data.error);
}

}

async function withdraw(){

const dana = document.getElementById("dana").value;

const res = await fetch("/api/withdraw",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({
telegram_id: user.id,
dana
})
});

const data = await res.json();

alert(data.success ? "Withdraw dikirim" : data.error);

}

async function loadLeaderboard(){

const res = await fetch("/api/leaderboard");
const data = await res.json();

if(!data.success) return;

document.getElementById("leaderboard").innerHTML =
data.data.map((u)=>`
#${u.rank} ${u.username || u.telegram_id}
💰 ${u.balance}
👥 ${u.referral_count || 0}
🏆 Lv ${u.level || 1}
`).join("<br>");

}

loadLeaderboard();

</script>

</body>
</html>
